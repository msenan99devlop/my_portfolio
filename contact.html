<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Mohammed Senan</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen transition-colors duration-500">
     <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen fixed inset-0 flex justify-center items-center z-50">
        <div class="loading-content text-center">
            <svg class="hexagon-svg w-36 h-36 animate-pulse" viewBox="0 0 100 100" style="color: var(--text-accent);">
                <polygon points="50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5" 
                        fill="none" stroke="currentColor" stroke-width="3" />
                <text x="50" y="55" text-anchor="middle" font-family="Poppins" 
                      font-size="20" fill="currentColor" font-weight="700">Contact</text>
            </svg>
            <div class="loading-text mt-4 font-semibold" style="color: var(--text-accent);">Loading...</div>
        </div>
    </div>


    <!-- Header/Navigation -->
    <header class="nav-header sticky top-0 z-40 backdrop-blur-lg">
        <nav class="w-full flex items-center justify-between py-4 px-4 md:px-10">
            <a href="index.html" class="w-10 h-10 rounded-full overflow-hidden border border-emerald-500 flex-shrink-0 block" style="border-color: var(--footer-text);">
                <img src="assets/personalphoto.png" alt="My Photo" class="w-full h-full object-cover">
            </a>
            <div class="flex space-x-3 md:space-x-6 flex-wrap justify-center">
                <a href="index.html#about" class="nav-item">About</a>
                <a href="skills.html" class="nav-item">Skills</a>
                <a href="services.html" class="nav-item">Services</a>
                <a href="contact.html" class="nav-item">Contact</a>
                <a href="contact.html" class="highlight-btn">Hire me</a>
            </div>
            <button class="theme-toggle p-2" id="theme-toggle" aria-label="Toggle theme">
                <i class="fas fa-sun text-lg md:text-xl" id="theme-icon"></i>
                <span id="theme-text" class="hidden sm:inline ml-1">Light</span>
            </button>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8 sm:px-6 sm:py-2 flex-1">
        <section class="contact-section mt-4 py-8">
            <h2 class="text-4xl font-bold text-center glow-text">Contact Me</h2>
            <p class="subtitle text-center font-semibold text-accent mb-6">Let's build something amazing together</p>
            
            <div class="contact-container max-w-6xl mx-auto px-4 grid md:grid-cols-2 gap-10">
                <div class="contact-form-box p-10 rounded-xl">
                    <form id="contact-form">
                        <input type="text" name="name" placeholder="Your Name" required class="mb-5">
                        <input type="email" name="email" placeholder="Your Email" required class="mb-5">
                        <textarea rows="4" name="message" placeholder="Your Message" required class="mb-5"></textarea>
                        <button type="submit">Send Message</button>
                    </form>
                </div>
                
                <div class="contact-info flex flex-col gap-7">
                    <div class="contact-info-item flex items-start">
                        <svg class="contact-info-icon mt-1 mr-4 w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <div class="contact-info-text">
                            <h3 class="font-bold text-lg mb-1">Email</h3>
                            <p class="text-gray-300">msenan99@gmail.com</p>
                        </div>
                    </div>
                    
                    <div class="contact-info-item flex items-start">
                        <svg class="contact-info-icon mt-1 mr-4 w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                            <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                        <div class="contact-info-text">
                            <h3 class="font-bold text-lg mb-1">Location</h3>
                            <p class="text-gray-300">Yemen, Sana'a</p>
                        </div>
                    </div>
                    
                    <div class="contact-info-item flex items-start">
                        <svg class="contact-info-icon mt-1 mr-4 w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                        </svg>
                        <div class="contact-info-text">
                            <h3 class="font-bold text-lg mb-1">LinkedIn</h3>
                            <p class="text-gray-300">@mohammed-senan</p>
                        </div>
                    </div>
                    
                    <div class="contact-info-item flex items-start">
                        <svg class="contact-info-icon mt-1 mr-4 w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C19.138 20.167 24 16.418 24 12c0-6.627-5.373-12-12-12z"/>
                        </svg>
                        <div class="contact-info-text">
                            <h3 class="font-bold text-lg mb-1">GitHub</h3>
                            <p class="text-gray-300">@mohammed-senan-dev</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer-section py-8 border-t">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="text-center md:text-left">
                    <h3 class="text-xl font-bold" style="font-family: 'Dancing Script', cursive; color: var(--footer-text);">
                        Mohammed Senan
                    </h3>
                </div>
                <div class="text-center md:text-right text-sm" style="color: var(--footer-text);">
                    &copy; M.S. All rights reserved 2024
                </div>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
